# Copy this to config/llama-swap.local.yaml or generate it with
# `python scripts/setup_release.py --provider llamaswap --model-dir /path/to/models`.
# Model IDs here must exactly match the model IDs in settings.local.json.
healthCheckTimeout: 180
globalTTL: 900
startPort: 5800

macros:
  "llama": >
    llama-server --port ${PORT}

models:
  "qwen2.5-3b-instruct-q4_k_m.gguf":
    cmd: >
      ${llama} --model /absolute/path/to/models/qwen2.5-3b-instruct-q4_k_m.gguf
      --n-gpu-layers 999 --ctx-size 8192
    ttl: 300
  "qwen2.5-7b-instruct-q4_k_m.gguf":
    cmd: >
      ${llama} --model /absolute/path/to/models/qwen2.5-7b-instruct-q4_k_m.gguf
      --n-gpu-layers 999 --ctx-size 8192
    ttl: 600
  "nomic-embed-text-v1.5-q4_k_m.gguf":
    cmd: >
      ${llama} --model /absolute/path/to/models/nomic-embed-text-v1.5-q4_k_m.gguf
      --embeddings --n-gpu-layers 999 --ctx-size 2048
    ttl: 0

groups:
  always_on:
    swap: false
    members:
      - "nomic-embed-text-v1.5-q4_k_m.gguf"
  chat:
    swap: true
    members:
      - "qwen2.5-3b-instruct-q4_k_m.gguf"
      - "qwen2.5-7b-instruct-q4_k_m.gguf"
